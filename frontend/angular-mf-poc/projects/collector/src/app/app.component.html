<div class="page">

    <p class="process-id">Identyfikator procesu: <strong>{{ processId }}</strong></p>

    <form>
      <label for="firstName">Imię</label>
      <input id="firstName" name="firstName" type="text" [(ngModel)]="firstName" placeholder="Wpisz imię" />      
      <div class="actions">
        <button type="button" (click)="openDecision()">DALEJ</button>
      </div>
    </form>
  </div>

  
</div>
